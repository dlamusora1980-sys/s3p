name: Build Unity iOS IPA (s3p)

on:
  workflow_dispatch: # Запуск вручную из вкладки Actions
  push:
    branches:
      - master
      - main

jobs:
  # 1. Сборка проекта Unity в Xcode-проект на Ubuntu
  buildWithUnity:
    name: Build Unity Project to Xcode
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v3
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}

      - name: Unity Builder (Create Xcode Project)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          targetPlatform: iOS
          unityVersion: 2022.3.62f3
          buildName: s3p_iOS
          buildsPath: build

      - name: Upload Xcode Project Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xcode-project
          path: build/iOS
          retention-days: 1

  # 2. Компиляция и экспорт .IPA через Xcode на macOS
  buildIPA:
    name: Build & Sign IPA using Xcode
    needs: buildWithUnity
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Xcode Project Artifact
        uses: actions/download-artifact@v4
        with:
          name: xcode-project
          path: build/iOS

      - name: Create ExportOptions.plist
        run: |
          cat <<EOF > build/iOS/ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>development</string>
              <key>compileBitcode</key>
              <false/>
          </dict>
          </plist>
          EOF

      - name: Build Xcode Archive
        run: |
          cd build/iOS/s3p_iOS
          xcodebuild -project Unity-iPhone.xcodeproj \
                     -scheme Unity-iPhone \
                     -sdk iphoneos \
                     -configuration Release \
                     -archivePath $RUNNER_TEMP/Unity-iPhone.xcarchive \
                     archive \
                     CODE_SIGN_STYLE="Automatic"

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
                     -archivePath $RUNNER_TEMP/Unity-iPhone.xcarchive \
                     -exportOptionsPlist build/iOS/ExportOptions.plist \
                     -exportPath $RUNNER_TEMP/output_ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: s3p-iOS-IPA
          path: ${{ runner.temp }}/output_ipa/*.ipa
          retention-days: 7